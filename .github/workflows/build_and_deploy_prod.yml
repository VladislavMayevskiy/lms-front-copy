name: Build and deploy app to prod

on:
  workflow_dispatch

env:
  AZURE_CONTAINER_REGISTRY: "eschoolsregistry"
  AZURE_CONTAINER_REGISTRY_RG: "production-maggot"
  CONTAINER: "lms-frontend-prod"
  DOCKERFILE: "Dockerfile"
  CLUSTER_RG: "production-maggot"
  CLUSTER_NAME: "eschools-production-marlin"
  DEPLOYMENT_MANIFEST_PATH: "deploy/prod"

jobs:
  buildAndDeploy:
    permissions:
      contents: read
      id-token: write
    runs-on: k8s-runner-main
    steps:

      - name: Install Azure CLI
        run: |
          sudo apt-get install -y ca-certificates curl apt-transport-https lsb-release gnupg
          curl -sL https://packages.microsoft.com/keys/microsoft.asc |
            gpg --dearmor |
            sudo tee /etc/apt/trusted.gpg.d/microsoft.gpg > /dev/null
          AZ_REPO=$(lsb_release -cs)
          echo "deb [arch=amd64] https://packages.microsoft.com/repos/azure-cli/ $AZ_REPO main" |
            sudo tee /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y azure-cli

      - uses: azure/setup-kubectl@v3
        with:
           version: 'v1.28.0'
        id: install

      - uses: actions/checkout@v3

      - name: Azure login
        uses: azure/login@v1.4.6
        with:
          creds: '${{ secrets.PROD_AZURE_CREDENTIALS }}'

      - name: Create env variable from github secrets
        run: |
          echo "${{ secrets.ENV_PROD }}" > .env.production

      - name: Login ACR
        run: |
          az acr login --name ${{ env.AZURE_CONTAINER_REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check if image already exists
        id: check_if_image_exists
        run: |
          IMAGE_TAG="${{ github.sha }}"
          EXISTS=$(az acr manifest list-metadata \
            --registry ${{ env.AZURE_CONTAINER_REGISTRY }} \
            --name ${{ env.CONTAINER }} \
            --query "[?tags && contains(tags, '${IMAGE_TAG}')]" \
            --output tsv --only-show-errors | xargs)
          
          if [ -n "$EXISTS" ]; then
            echo "Image already exists in ACR for tag: $IMAGE_TAG"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Image does not exist in ACR for tag: $IMAGE_TAG"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push image
        if: ${{ steps.check_if_image_exists.outputs.exists != 'true' }}
        run: |
          docker buildx build \
            --file ${{ env.DOCKERFILE }} \
            --tag ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER }}:${{ github.sha }} \
            --tag ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER }}:latest \
            --cache-from type=registry,ref=${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER }}:latest \
            --cache-to type=inline \
            --push \
            .

      - name: Get K8s context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.CLUSTER_RG }}
          cluster-name: ${{ env.CLUSTER_NAME }}
          admin: true

      - name: Create env variable from github secrets
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
        run: |
          echo "$ENV_PROD" > .env.production

      - name: Create env configmap from env file
        run: |
          kubectl -n production create configmap lms-frontend --from-file=.env.production --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy application
        uses: Azure/k8s-deploy@v4
        with:
          action: deploy
          manifests: ${{ env.DEPLOYMENT_MANIFEST_PATH }}
          images: |
            ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER }}:${{ github.sha }}
          namespace: production
